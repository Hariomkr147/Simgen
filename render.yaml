# Render Blueprint — https://render.com/docs/blueprint-spec
# One-click deploy: connect this repo on Render and it reads this file.
# Model/API env vars marked "sync: false" must be filled in on the Render
# dashboard (Environment tab) — copy the values from .env.example.
services:
  - type: web
    name: simgen
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_API_KEY
        sync: false
      - key: TEACHER
        value: opus5
      - key: STUDENT
        value: gemini38flash
      - key: JUDGE
        value: deepseekv41flash
      - key: JUDGE_ENABLED
        value: "true"
      - key: TEACHER_MODELS
        value: opus55,opus5,fable51,astra6,glm53,sol6
      - key: STUDENT_MODELS
        value: musespark13c,gemini38flash,deepseekv41flash,opus55,glm53,sol6,gemini37flash,hy4preview
      - key: USD_INR
        value: "95.6"
      - key: NCERT_DSN
        sync: false
