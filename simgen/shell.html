<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#b0226b">
<title>Lab</title>
<!-- simgen Lab-app shell. Everything here is fixed; the pipeline only swaps the
     TOPIC script (between the TOPIC-START/TOPIC-END markers) for each topic. -->
<style>
:root{
  --bg:#f1edf5; --surface:#ffffff; --ink:#1d1a26; --muted:#5f5a6e; --line:#ddd6e6; --chip:#f0ebf6;
  --accent:#b0226b; --accent-ink:#ffffff; --accent-soft:color-mix(in srgb,var(--accent) 13%,#fff);
  --gold:#f5b301; --gold-ink:#241a00;
  --good:#0e7a3c; --good-soft:#dcefe2; --bad:#b93838; --bad-soft:#f8e3e3;
  --hud:rgba(10,20,14,.82); --hud-ink:#ffc545; --hud-dim:#a9c2b1;
  --shadow:0 6px 24px rgba(16,40,24,.10);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --score:"Chakra Petch",ui-monospace,"Cascadia Code","Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15121b; --surface:#1f1a28; --ink:#ece8f2; --muted:#a8a1b8; --line:#342c40; --chip:#2a2334;
    --accent-ink:#1a0710; --accent-soft:color-mix(in srgb,var(--accent) 22%,#1f1a28);
    --good:#5cc88a; --good-soft:#15301f; --bad:#ff8080; --bad-soft:#3a1a1c;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15121b; --surface:#1f1a28; --ink:#ece8f2; --muted:#a8a1b8; --line:#342c40; --chip:#2a2334;
  --accent-ink:#1a0710; --accent-soft:color-mix(in srgb,var(--accent) 22%,#1f1a28);
  --good:#5cc88a; --good-soft:#15301f; --bad:#ff8080; --bad-soft:#3a1a1c;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
     padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
     -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;font-weight:700;cursor:pointer;color:var(--ink);touch-action:manipulation}
button:focus-visible,input[type=range]:focus-visible,.opt input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}

/* ---------- App shell ---------- */
.app{height:100%;min-height:520px;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;padding:10px 16px 12px;gap:10px}
.topbar{display:flex;align-items:center;gap:10px;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;
      background:linear-gradient(160deg,var(--accent),#7a3fd1);color:#fff;font-family:var(--display);font-weight:800;font-size:15px;line-height:1}
.brand h1{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:inline-grid;grid-auto-flow:column;gap:2px;padding:3px;background:var(--chip);border-radius:999px;flex:none}
.tabs button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:18px;flex:none;padding:0}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- Play screen ---------- */
.play{position:relative;flex:1;min-height:0;display:grid;gap:10px;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"coach coach" "stage side"}
.coach{grid-area:coach;min-width:0;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;display:flex;align-items:center;gap:12px;border:1px solid var(--line)}
.badge{width:44px;height:40px;border-radius:12px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12px;flex:none;line-height:1;letter-spacing:.02em}
.badge.err{background:var(--bad);color:#fff}
.coach-body{flex:1;min-width:0;display:grid;gap:2px}
.coach-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.dots{display:flex;gap:4px}
.dots i{width:16px;height:5px;border-radius:3px;background:var(--chip)}
.dots i.on{background:var(--accent)} .dots i.done{background:var(--gold)}
.coach-do{font-size:15px}
.btn.play{padding:6px 12px;min-height:0;font-size:13px;border-radius:10px;flex:none;white-space:nowrap}
.mode{display:inline-grid;grid-auto-flow:column;gap:2px;padding:3px;background:var(--chip);border-radius:10px;flex:none}
.mode button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:13px}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.stage{grid-area:stage;position:relative;border-radius:16px;overflow:hidden;min-height:190px;background:#fbfaf8;box-shadow:var(--shadow)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:8px;left:8px;right:8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--hud);border-radius:12px;padding:6px 10px;pointer-events:none}
.hud div{display:grid;min-width:0}
.hud span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--hud-dim);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud b{font-family:var(--score);font-size:20px;color:var(--hud-ink);font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud b small{font-size:11px;color:var(--hud-dim);font-weight:600;margin-left:2px}

.side{grid-area:side;display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0;overflow:auto}
.side>*{min-width:0;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.label em{font-style:normal;color:var(--accent);text-transform:none;letter-spacing:0;font-size:14px}
.grounds{display:grid;gap:6px;margin-top:8px}
.gchip{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 10px;text-align:left;min-height:44px;font-size:14px;white-space:nowrap;touch-action:manipulation}
.gchip span{display:grid;line-height:1.2}
.gchip small{font-weight:400;color:var(--muted);font-size:12px}
.gchip .ico{width:30px;height:30px;border-radius:9px;background:var(--chip);display:grid;place-items:center;flex:none;font-weight:800;font-size:12px;color:var(--accent)}
.gchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.gchip[aria-pressed="true"] .ico{background:var(--surface)}
.gchip:disabled{opacity:.6}
.ctrl.hl{outline:3px solid var(--gold);outline-offset:3px;border-radius:14px}
.ctls{display:grid;gap:10px}
.ctl{display:grid;gap:2px}
input[type=range]{width:100%;accent-color:var(--accent);height:32px;margin:0}
input[type=range]:disabled{opacity:.5}
.label .tag{font:inherit;font-size:12px;font-weight:700;letter-spacing:0;text-transform:none;border:1.5px solid #e2b93b;background:transparent;color:#9a6c00;border-radius:999px;padding:3px 10px;cursor:pointer}
.label .tag[aria-pressed="true"]{background:#f5b301;color:#241a00;border-color:#f5b301}
.acts{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
.act{display:grid;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;min-height:46px;line-height:1.2;position:relative;touch-action:manipulation}
.act b{font-size:15px}
.act small{font-weight:400;color:var(--muted);font-size:12px}
.act.hint{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);animation:pulse 1.4s infinite}
.act.done{background:var(--good-soft);border-color:var(--good);opacity:.85}
.act.done b::before{content:"✓ ";color:var(--good)}
.act.doing{border-color:var(--accent);background:var(--accent-soft)}
.act.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.act:disabled{cursor:default}
.reset{margin-top:8px;border:0;background:transparent;color:var(--muted);font-size:13px;padding:4px 0;text-align:left}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--accent-soft)}50%{box-shadow:0 0 0 6px var(--accent-soft)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- Question sheet ---------- */
.sheet-back{position:absolute;inset:0;background:rgba(8,16,11,.18);border-radius:16px;z-index:30}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:74%;overflow:auto;z-index:31;background:var(--surface);border-radius:20px 20px 16px 16px;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding:12px 16px 16px;display:grid;gap:10px}
@media (min-width:761px){
  .sheet-back{left:auto;width:320px;background:transparent}
  .sheet{left:auto;right:0;width:340px;max-height:calc(100% - 70px);border-radius:18px;border:2px solid var(--gold)}
}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet h3{font-size:19px}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.opts{display:grid;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt label{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg);min-height:44px}
.opt .key{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-weight:700;font-size:13px}
.opt input:checked+label{border-color:var(--accent);background:var(--accent-soft)}
.opt.right label{border-color:var(--good);background:var(--good-soft)}
.opt.wrong label{border-color:var(--bad);background:var(--bad-soft)}
.explain{font-size:15px;padding:10px 12px;border-radius:10px;background:var(--chip)}
.explain b.ok{color:var(--good)} .explain b.no{color:var(--bad)}
.btn{border-radius:12px;padding:12px 18px;border:0;background:var(--accent);color:var(--accent-ink);min-height:48px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--chip);color:var(--ink)}
.words{display:grid;gap:8px}
.word{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px}
.word b{font-family:var(--display);font-size:17px;display:block}

/* ---------- Think screen ---------- */
.think{flex:1;min-height:0;overflow:auto;display:grid;gap:12px;align-content:start;padding-bottom:8px}
.think-head{display:grid;gap:4px}
.think-head h2{font-size:26px}
.think-head p{color:var(--muted)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;box-shadow:var(--shadow)}
.q-text{font-weight:700;font-size:17px}
.q .opts{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.think-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.result{font-size:17px;padding:12px 14px;border-radius:14px;background:var(--good-soft);border:1px solid var(--good)}

/* ---------- Phone ---------- */
@media (max-width:760px){
  .app{padding:8px 12px 10px;gap:8px;min-height:480px}
  .brand h1{font-size:17px}
  .brand{gap:8px}
  .brand small{display:none}
  .logo{width:30px;height:30px;font-size:13px}
  .tabs button{padding:6px 12px}
  .iconbtn{width:32px;height:32px;font-size:16px}
  .play{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(170px,1fr) auto;grid-template-areas:"coach" "stage" "side";gap:8px}
  .coach{padding:8px 10px;gap:10px;border-radius:14px}
  .badge{width:38px;height:34px;border-radius:10px;font-size:10px}
  .coach-do{font-size:14px}
  .mode button{padding:5px 8px;font-size:12px}
  .stage{border-radius:14px;min-height:170px}
  .hud{padding:5px 8px}
  .hud b{font-size:16px}
  .hud span{font-size:9px}
  .side{gap:8px;overflow:visible}
  .card{padding:8px 10px;border-radius:14px;box-shadow:none}
  .ground-card .label{display:none}
  .grounds{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;margin-top:0;scrollbar-width:none;padding:2px 28px 2px 2px;
           -webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .grounds::-webkit-scrollbar{display:none}
  .gchip{min-height:40px;padding:6px 10px}
  .gchip small{display:none}
  .gchip .ico{width:24px;height:24px}
  .ctl{grid-template-columns:auto 1fr;align-items:center;gap:12px}
  .ctl .label{display:grid;gap:0}
  .acts{grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
  .act{padding:6px 7px;min-height:44px}
  .act b{font-size:13px}.act small{display:none}
  .reset{margin-top:4px;padding:2px 0}
  .q .opts{grid-template-columns:1fr}
}
@media (max-width:760px) and (max-height:640px){.coach-do{font-size:13px}}
@media (prefers-reduced-motion: reduce){.act.hint,.act.wrong{animation:none}}
</style>
<style id="accentStyle"></style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo" id="aMark" aria-hidden="true"></span>
      <div style="min-width:0"><h1 id="aName">Lab</h1><small id="aSub"></small></div>
    </div>
    <div class="tabs" role="tablist" aria-label="Screens">
      <button role="tab" id="tabPlay" aria-selected="true" aria-controls="scrPlay">Play</button>
      <button role="tab" id="tabThink" aria-selected="false" aria-controls="scrThink">Think</button>
    </div>
    <button class="iconbtn" id="bInfo" aria-label="Key words">?</button>
  </header>

  <section class="screen" id="scrPlay" role="tabpanel" aria-labelledby="tabPlay">
    <div class="play">
      <div class="coach" aria-live="polite">
        <div class="badge" id="coachIcon" aria-hidden="true">GUIDE</div>
        <div class="coach-body">
          <div class="coach-top"><span class="pill" id="gStep"></span><span class="dots" id="gDots"></span></div>
          <p class="coach-do" id="gDo"></p>
        </div>
        <button class="btn play" id="bPlay" aria-label="Start automatic walkthrough">▶ Start</button>
        <div class="mode" role="group" aria-label="Mode">
          <button id="modeGuided" aria-pressed="true">Guide</button>
          <button id="modeFree" aria-pressed="false">Challenge</button>
        </div>
      </div>

      <div class="stage">
        <canvas id="cv" role="img" aria-label="Simulation"></canvas>
        <div class="hud" id="hud" aria-live="off"></div>
      </div>

      <div class="side">
        <div class="card ground-card ctrl" id="cR">
          <div class="label"><span id="rLabel">Options</span> <em id="vR"></em></div>
          <div class="grounds" role="group" id="rBtns"></div>
        </div>
        <div class="card ctrl" id="cC"><div class="ctls" id="ctls"></div></div>
        <div class="card ctrl" id="cA">
          <div class="label">What happens next? <button class="tag" id="bTag" aria-pressed="false" hidden></button></div>
          <div class="acts" id="acts"></div>
          <button class="reset" id="bReset">↺ Start again</button>
        </div>
      </div>

      <div class="sheet-back" id="sheetBack" hidden></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
        <div class="grab" aria-hidden="true"></div>
        <div class="pill" id="sheetPill"></div>
        <h3 id="sheetTitle"></h3>
        <div id="sheetBody"></div>
        <div class="sheet-foot" id="sheetFoot"></div>
      </div>
    </div>
  </section>

  <section class="screen" id="scrThink" role="tabpanel" aria-labelledby="tabThink" hidden>
    <div class="think">
      <div class="think-head"><h2>Think about it</h2><p id="thinkIntro">Pick the best answer.</p></div>
      <div id="thinkList" style="display:grid;gap:12px"></div>
      <div class="think-bar">
        <button class="btn" id="thinkCheck">Check my answers</button>
        <span id="thinkScore" style="font-weight:700" aria-live="polite"></span>
      </div>
      <div class="result" id="thinkResult" hidden></div>
    </div>
  </section>
</div>

<script>
/* ---------- Shared state + drawing helpers (available to the TOPIC script) ---------- */
window.__errs=[];addEventListener("error",e=>{__errs.push((e.message||"script error")+(e.lineno?" (line "+e.lineno+")":""));});
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");
let W=600,H=400,T=0,step=0,anim=null;   // step = steps completed; anim = {i,t,dur,k} while step i animates
const S={preset:0,toggle:false,c:{}};
const VIEW={x:14,y:100,w:572,h:252};    // safe drawing box: below the HUD, above the caption
const INK="#26323b",FONT="'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif";
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k;
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function txt(t,x,y,o={}){ctx.font=`${o.weight||700} ${o.size||13}px ${FONT}`;ctx.fillStyle=o.color||INK;ctx.textAlign=o.align||"center";ctx.textBaseline="middle";ctx.fillText(String(t),x,y);ctx.textBaseline="alphabetic";}
function pill(t){ctx.font=`700 14px ${FONT}`;const tw=Math.min(W-16,ctx.measureText(t).width+22);ctx.fillStyle="rgba(38,50,59,.88)";rr(W/2-tw/2,H-36,tw,26,13);ctx.fill();ctx.fillStyle="#fff";ctx.textAlign="center";ctx.fillText(t,W/2,H-18,W-28);}
function arrow(x0,y0,x1,y1,o={}){const c=o.color||INK,w=o.width||3,a=Math.atan2(y1-y0,x1-x0),s=Math.max(8,w*3.2);ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1-Math.cos(a)*s*.8,y1-Math.sin(a)*s*.8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1-Math.cos(a-.45)*s,y1-Math.sin(a-.45)*s);ctx.lineTo(x1-Math.cos(a+.45)*s,y1-Math.sin(a+.45)*s);ctx.closePath();ctx.fill();
  if(o.label)txt(o.label,(x0+x1)/2+Math.sin(a)*14,(y0+y1)/2-Math.cos(a)*14,{color:c,size:12});}
function curly(x0,y0,x1,y1,bend=1,prog=1,color="#7a3fd1"){
  const mx=(x0+x1)/2,my=(y0+y1)/2,dx=x1-x0,dy=y1-y0,cx=mx-dy*.45*bend,cy=my+dx*.45*bend,N=30,n=Math.max(2,Math.floor(N*clamp(prog,0,1)));
  ctx.strokeStyle=color;ctx.lineWidth=3;ctx.lineCap="round";ctx.beginPath();let lx,ly,px,py;
  for(let i=0;i<=n;i++){const t=i/N,x=(1-t)*(1-t)*x0+2*(1-t)*t*cx+t*t*x1,y=(1-t)*(1-t)*y0+2*(1-t)*t*cy+t*t*y1;if(!i)ctx.moveTo(x,y);else ctx.lineTo(x,y);px=lx;py=ly;lx=x;ly=y;}
  ctx.stroke();
  if(prog>.95&&px!=null){const a=Math.atan2(ly-py,lx-px),s=10;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(lx+Math.cos(a)*2,ly+Math.sin(a)*2);ctx.lineTo(lx-Math.cos(a-.45)*s,ly-Math.sin(a-.45)*s);ctx.lineTo(lx-Math.cos(a+.45)*s,ly-Math.sin(a+.45)*s);ctx.closePath();ctx.fill();}}
let __banner=null;function banner(text,bad=false,t=2){__banner={text,bad,t};}
function ctlText(c,v){const d=String(c.step||1).split(".")[1];return (+v).toFixed(d?d.length:0)+(c.unit?" "+c.unit:"");}
function setControl(id,v){S.c[id]=+v;const el=$("ctl-"+id);if(el)el.value=v;const c=(window.__controls||[]).find(c=>c.id===id),o=$("ctlv-"+id);if(c&&o)o.textContent=ctlText(c,v);}
</script>

<script>
/*@@TOPIC-START@@*/
// __SHELL_EXAMPLE__ : a complete example topic. The pipeline replaces everything
// between the TOPIC-START and TOPIC-END markers with the generated topic script.
const APP={name:"Pendulum Lab",subtitle:"Class 9 · Motion · Time period of a simple pendulum",mark:"T",accent:"#1f6fd1",accentDark:"#6aa6ff"};
const PRESETS={label:"Planet",options:[
  {name:"Earth",sub:"g = 9.8 m/s²",ico:"E",g:9.8},
  {name:"Moon",sub:"g = 1.6 m/s²",ico:"M",g:1.6},
  {name:"Jupiter",sub:"g = 24.8 m/s²",ico:"J",g:24.8}]};
const CONTROLS=[{id:"L",label:"String length",unit:"m",min:0.25,max:2,step:0.05,value:0.5}];
const TOGGLE={label:"Forces"};
const HUD=["Length","g","Period T","Swings"];
const STEPS=[
 {name:"Pull aside",sub:"to 12°",do:"Pull the bob a little to one side, keeping the string <b>tight</b>.",result:"Bob pulled aside",dur:1.2,
  ask:{q:"Why do we pull the bob aside only a little (a small angle)?",o:["For small angles the time period does not depend on the angle","So the string does not break","So gravity becomes weaker","So the bob moves faster"],a:0,
       e:"For small angles the time period of a simple pendulum is almost the same whatever the amplitude, so the timing is fair."}},
 {name:"Release",sub:"let it swing",do:"Let go. <b>Gravity</b> pulls the bob back towards the middle.",result:"Swinging!",dur:2,
  ask:{q:"Which force pulls the bob back towards the middle?",o:["A part of its weight (gravity)","Air pressure","The push from your hand","Friction at the pivot"],a:0,
       e:"Part of the bob's weight acts along the arc towards the lowest point. This restoring force makes it swing to and fro."}},
 {name:"Time 3 swings",sub:"measure T",do:"Count <b>3 complete swings</b> and divide the time by 3.",result:"Period measured",dur:()=>3*period(),
  ask:{q:"Why do we time 3 swings and divide, instead of timing just one?",o:["It reduces the error of starting and stopping the watch","One swing is too fast to happen","The first swing is always wrong","It makes the pendulum faster"],a:0,
       e:"Our reaction time adds the same error to every timing. Spreading it over several swings makes the error per swing smaller."}},
 {name:"4× longer",sub:"L × 4",do:"Make the string <b>four times longer</b> and watch the period.",result:"Period doubled",dur:1.5,
  ask:{q:"The length became 4 times. The time period became…",o:["2 times","4 times","Half","The same"],a:0,
       e:"T = 2π√(L/g). T depends on the square root of L, so 4 times the length gives √4 = 2 times the period."}}
];
const THINK=[
 {q:"A pendulum clock runs slow. What should you do to its pendulum?",o:["Make it shorter","Make it longer","Use a heavier bob","Swing it wider"],a:0,e:"A shorter pendulum has a smaller period, so it ticks faster and the clock catches up."},
 {q:"The same pendulum is taken to the Moon (g is about 1/6 of Earth's). Its period will…",o:["Increase","Decrease","Stay the same","Become zero"],a:0,e:"T = 2π√(L/g). A smaller g makes T larger, so it swings more slowly."},
 {q:"Two pendulums have equal lengths but bobs of 50 g and 200 g. Their periods are…",o:["Equal","Longer for 200 g","Longer for 50 g","Impossible to say"],a:0,e:"The mass of the bob does not appear in T = 2π√(L/g), so equal lengths give equal periods."}
];
const WORDS=[
 {t:"Oscillation",d:"One complete to-and-fro motion of the bob."},
 {t:"Time period (T)",d:"Time taken for one complete oscillation, in seconds."},
 {t:"Amplitude",d:"The largest distance (or angle) of the bob from its middle position."},
 {t:"Restoring force",d:"The force that always pulls the bob back towards the middle position."}
];
const FINISH={title:"Pendulum measured!",html:"<p>The period depends on the <b>length</b> and on <b>g</b>, not on the mass of the bob.</p><p style=\"margin-top:6px\">T = 2π√(L/g): four times the length gives two times the period.</p>"};

let th=0,om=0,swings=0,lastTh=0,timerOn=false,L0=0.5;
const A0=12*Math.PI/180;
function g(){return PRESETS.options[S.preset].g;}
function period(){return 2*Math.PI*Math.sqrt(S.c.L/g());}
function resetSim(){th=0;om=0;swings=0;timerOn=false;}
function onControl(){if(step<2)return;th=A0;om=0;swings=0;}
function startStep(i){
  if(i===2){swings=0;timerOn=true;}
  if(i===3){L0=Math.min(S.c.L,0.5);timerOn=false;}
}
function update(dt){
  if(anim&&anim.i===0){th=A0*ease(anim.k);om=0;return;}
  if(anim&&anim.i===3){setControl("L",L0*(1+3*ease(anim.k)));}   // string visibly grows to 4×
  if(step<2&&!(anim&&anim.i>=1))return;            // not released yet
  for(let n=0;n<10;n++){const h=dt/10;om+=-(g()/S.c.L)*Math.sin(th)*h;th+=om*h;}
  if(timerOn&&lastTh<0&&th>=0)swings++;              // one crossing per full swing
  lastTh=th;
  if(step>=3&&!anim)timerOn=false;
}
function draw(ctx,W,H){
  const px=VIEW.h/2.15,ox=VIEW.x+VIEW.w/2,oy=VIEW.y+6,L=S.c.L*px;
  const bx=ox+Math.sin(th)*L,by=oy+Math.cos(th)*L;
  ctx.fillStyle="#8a7b6a";rr(ox-70,oy-8,140,8,3);ctx.fill();
  ctx.setLineDash([4,5]);ctx.strokeStyle="rgba(38,50,59,.25)";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox,oy+L+24);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(bx,by);ctx.stroke();
  ctx.fillStyle="#1f6fd1";ctx.beginPath();ctx.arc(bx,by,13,0,6.3);ctx.fill();
  txt("bob",bx+26,by,{color:"#1f6fd1",size:12});
  txt(`L = ${S.c.L.toFixed(2)} m`,ox-44,oy+L/2,{size:12});
  if(S.toggle){arrow(bx,by,bx,by+46,{color:"#d23b3b",label:"mg"});arrow(bx,by,bx+(ox-bx)*.35,by+(oy-by)*.35,{color:"#7a3fd1",label:"tension"});}
  pill(`T = 2π√(L/g) = ${period().toFixed(2)} s`);
}
function readouts(){
  return [S.c.L.toFixed(2)+"<small>m</small>",g().toFixed(1)+"<small>m/s²</small>",
          (step>=3||(anim&&anim.i>=2)?period().toFixed(2):"–")+"<small>s</small>",String(swings)];
}
/*@@TOPIC-END@@*/
</script>

<script>
/* ---------- Engine (fixed): tabs, guide/challenge, questions, HUD, loop ---------- */
(function(){
const get=f=>{try{return f();}catch(e){return undefined;}};
const CFG={app:get(()=>APP),presets:get(()=>PRESETS),controls:get(()=>CONTROLS)||[],toggle:get(()=>TOGGLE),
  hud:get(()=>HUD)||[],steps:get(()=>STEPS),think:get(()=>THINK)||[],words:get(()=>WORDS)||[],finish:get(()=>FINISH)||{}};
window.__controls=CFG.controls;
const hook=n=>typeof window[n]==="function"?window[n]:null;
let hookErr=false;
function safe(n,...a){const f=hook(n);if(!f)return undefined;try{return f(...a);}catch(e){if(!hookErr){hookErr=true;showErr("Simulation error in "+n+"(): "+e.message);}return undefined;}}
function showErr(msg){$("coachIcon").textContent="ERR";$("coachIcon").classList.add("err");$("gStep").textContent="Something went wrong";$("gDo").textContent=msg;}

let dpr=1;
function resize(){const r=cv.getBoundingClientRect();if(!r.width)return;dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);else addEventListener("resize",resize);

if(!CFG.app||!Array.isArray(CFG.steps)||!CFG.steps.length||!hook("draw")){
  resize();showErr("This simulation did not build correctly."+(__errs[0]?" "+__errs[0]:""));return;
}
const APPC=CFG.app,STEPSC=CFG.steps,N=STEPSC.length;

/* ---------- Branding ---------- */
document.title=APPC.name||"Lab";$("aName").textContent=APPC.name||"Lab";$("aSub").textContent=APPC.subtitle||"";
$("aMark").textContent=APPC.mark||(APPC.name||"L").slice(0,1);
if(APPC.accent){const d=APPC.accentDark||APPC.accent;
  $("accentStyle").textContent=`:root{--accent:${APPC.accent}}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:${d}}}:root[data-theme="dark"]{--accent:${d}}`;
  $("themeColor").setAttribute("content",APPC.accent);}

/* ---------- Questions ---------- */
function optsHTML(q,name){return `<div class="opts">${(q.o||[]).map((o,j)=>`<div class="opt"><input type="radio" id="${name}-${j}" name="${name}" value="${j}"><label for="${name}-${j}"><span class="key">${"ABCD"[j]||j+1}</span><span>${o}</span></label></div>`).join("")}</div><div class="explain" hidden></div>`;}
function markQ(box,q){
  const picked=box.querySelector("input:checked");
  box.querySelectorAll(".opt").forEach((o,j)=>{o.classList.remove("right","wrong");if(j===q.a)o.classList.add("right");else if(picked&&+picked.value===j)o.classList.add("wrong");});
  const ok=!!picked&&+picked.value===q.a,ex=box.querySelector(".explain");ex.hidden=false;
  ex.innerHTML=(ok?'<b class="ok">Correct.</b> ':(picked?'<b class="no">Not quite.</b> ':'<b class="no">Not answered.</b> '))+(q.e||"");
  return ok;
}
const TH=CFG.think;
$("thinkIntro").textContent=`${TH.length} questions. Pick the best answer.`;
$("thinkList").innerHTML=TH.map((q,i)=>`<div class="q" data-i="${i}"><div class="q-text">${i+1}. ${q.q}</div>${optsHTML(q,"think-"+i)}</div>`).join("");
$("thinkCheck").onclick=()=>{
  let s=0;TH.forEach((q,i)=>{if(markQ($("thinkList").querySelector(`.q[data-i="${i}"]`),q))s++;});
  $("thinkScore").textContent=`You got ${s} out of ${TH.length}.`;
  const r=$("thinkResult");r.hidden=false;
  r.textContent=s===TH.length?"Full marks! Well done.":s>=TH.length-1?"Good work! Read the explanation for the one you missed.":"Go back to Play, run it again, then try once more.";
};
if(!TH.length)$("tabThink").hidden=true;

/* ---------- Tabs & sheet ---------- */
function showTab(t){const play=t==="play";
  $("tabPlay").setAttribute("aria-selected",play);$("tabThink").setAttribute("aria-selected",!play);
  $("scrPlay").hidden=!play;$("scrThink").hidden=play;if(play)requestAnimationFrame(resize);}
$("tabPlay").onclick=()=>showTab("play");$("tabThink").onclick=()=>showTab("think");
function openSheet(p,title,body,foot){$("sheetPill").textContent=p;$("sheetTitle").textContent=title;$("sheetBody").innerHTML=body;$("sheetFoot").innerHTML=foot;$("sheet").hidden=false;$("sheetBack").hidden=false;}
function closeSheet(){$("sheet").hidden=true;$("sheetBack").hidden=true;}
$("bInfo").onclick=()=>{
  if(asking)return;if($("scrPlay").hidden)showTab("play");
  openSheet("Key words","Words to know",`<div class="words">${CFG.words.map(w=>`<div class="word"><b>${w.t}</b>${w.d}</div>`).join("")}</div>`,`<button class="btn" id="sheetOk">Got it</button>`);
  $("sheetOk").onclick=closeSheet;
};
if(!CFG.words.length)$("bInfo").hidden=true;
$("sheetBack").onclick=()=>{if(!asking)closeSheet();};

/* ---------- Side panel: presets, sliders, toggle, step buttons ---------- */
const P=CFG.presets&&Array.isArray(CFG.presets.options)&&CFG.presets.options.length?CFG.presets:null;
const rb=$("rBtns");
if(!P)$("cR").hidden=true;else{
  $("rLabel").textContent=P.label||"Options";$("vR").textContent=P.options[0].name;
  P.options.forEach((p,i)=>{const e=document.createElement("button");e.className="gchip";e.dataset.i=i;e.setAttribute("aria-pressed",i===0);
    e.innerHTML=`<span class="ico">${p.ico||p.name.slice(0,2)}</span><span>${p.name}<small>${p.sub||""}</small></span>`;e.onclick=()=>setPreset(i);rb.appendChild(e);});
}
function setPreset(i){if(anim||asking)return;S.preset=i;rb.querySelectorAll("button").forEach(e=>e.setAttribute("aria-pressed",+e.dataset.i===i));$("vR").textContent=P.options[i].name;safe("onPreset",i);resetMech();}

const CT=CFG.controls;
if(!CT.length)$("cC").hidden=true;
CT.forEach(c=>{S.c[c.id]=+c.value;const d=document.createElement("div");d.className="ctl";
  d.innerHTML=`<div class="label"><span>${c.label}</span> <em id="ctlv-${c.id}">${ctlText(c,c.value)}</em></div><input type="range" id="ctl-${c.id}" min="${c.min}" max="${c.max}" step="${c.step||1}" value="${c.value}" aria-label="${c.label}">`;
  $("ctls").appendChild(d);
  d.querySelector("input").oninput=e=>{S.c[c.id]=+e.target.value;$("ctlv-"+c.id).textContent=ctlText(c,e.target.value);safe("onControl",c.id);};
});
if(CFG.toggle&&CFG.toggle.label){const b=$("bTag");b.hidden=false;b.textContent=CFG.toggle.label;b.onclick=()=>{S.toggle=!S.toggle;b.setAttribute("aria-pressed",S.toggle);safe("onToggle",S.toggle);};}

const ab=$("acts");
STEPSC.forEach((a,i)=>{const e=document.createElement("button");e.className="act";e.dataset.i=i;e.innerHTML=`<b>${a.name}</b><small>${a.sub||""}</small>`;e.onclick=()=>tryAct(i);ab.appendChild(e);});
$("bReset").onclick=()=>{if(!anim)resetMech();};

/* ---------- HUD ---------- */
const hudEl=$("hud"),hudB=[],hudCache=[];
for(let i=0;i<4;i++){const h=CFG.hud[i],lab=h==null?"":(typeof h==="string"?h:h.label||"");const d=document.createElement("div");d.innerHTML=`<span>${lab}</span><b>–</b>`;hudEl.appendChild(d);hudB.push(d.querySelector("b"));}
function updateHud(){const v=safe("readouts")||[];for(let i=0;i<4;i++){const s=v[i]==null?"–":String(v[i]);if(s!==hudCache[i]){hudB[i].innerHTML=s;hudCache[i]=s;}}}

/* ---------- Mechanics ---------- */
function durOf(i){const d=STEPSC[i].dur,v=typeof d==="function"?get(d):d;return clamp(+v||2.3,.3,30);}
function resetMech(){auto=false;paused=false;playLabel();step=0;anim=null;__banner=null;safe("resetSim");updateActs();if(guided)renderGuide();else renderFree();}
function tryAct(i){
  if(anim||step>=N||asking||paused)return;
  const btn=ab.children[i];
  if(i!==step){btn.classList.remove("wrong");void btn.offsetWidth;btn.classList.add("wrong");setTimeout(()=>btn.classList.remove("wrong"),650);
    banner(i<step?"Already done!":"Not yet. What must happen first?",true,1.8);return;}
  anim={i,t:0,dur:durOf(i),k:0};safe("startStep",i);btn.classList.add("doing");updateActs();
}
function updateActs(){
  [...ab.children].forEach((b,i)=>{b.classList.toggle("done",i<step);b.classList.toggle("hint",guided&&i===step&&!anim&&!asking);b.disabled=!!anim||i<step;if(!anim)b.classList.remove("doing");});
  rb.querySelectorAll("button").forEach(b=>b.disabled=!!anim);
  $("ctls").querySelectorAll("input").forEach(e=>e.disabled=!!anim);
}
function stepSim(dt){
  T+=dt;if(__banner){__banner.t-=dt;if(__banner.t<=0)__banner=null;}
  if(anim){anim.t+=dt;anim.k=clamp(anim.t/anim.dur,0,1);}
  safe("update",dt);
  if(anim&&anim.t>=anim.dur){
    const i=anim.i;step=i+1;anim=null;updateActs();
    banner(STEPSC[i].result||"Done",false,2);
    if(step===N)banner(CFG.finish.banner||CFG.finish.title||"Complete!",false,2.6);
    setTimeout(()=>guideEvent(i+1),700);autoAt=performance.now()+1000;
    if(!guided)renderFree();
  }
}

/* ---------- Drawing ---------- */
function board(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#fbfaf8");g.addColorStop(1,"#f0edf5");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(60,50,90,.06)";ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<W;x+=24){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H);}for(let y=0;y<H;y+=24){ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);}ctx.stroke();}
function drawBanner(){
  if(!__banner)return;const a=Math.min(1,__banner.t*3);
  ctx.font="800 17px 'Baloo 2','Trebuchet MS',sans-serif";const tw=Math.min(W-20,ctx.measureText(__banner.text).width+26),bh=32;
  ctx.globalAlpha=a;ctx.fillStyle=__banner.bad?"#b93838":"#f5b301";rr(W/2-tw/2,64,tw,bh,10);ctx.fill();
  ctx.fillStyle=__banner.bad?"#fff":"#241a00";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(__banner.text,W/2,64+bh/2+1,W-30);ctx.textBaseline="alphabetic";ctx.globalAlpha=1;
}
function frame(){
  ctx.clearRect(0,0,W,H);board();
  VIEW.x=14;VIEW.w=Math.max(40,W-28);VIEW.y=H<300?66:100;VIEW.h=Math.max(60,H-VIEW.y-48);
  ctx.save();safe("draw",ctx,W,H);ctx.restore();drawBanner();
}

/* ---------- Guide / Challenge ---------- */
let guided=true,asking=false,auto=false,paused=false,autoAt=0;
function clearHL(){document.querySelectorAll(".ctrl").forEach(c=>c.classList.remove("hl"));}
function renderGuide(){
  $("coachIcon").textContent="GUIDE";if(step>=N)return;
  const a=STEPSC[step];
  $("gStep").textContent=`Step ${step+1} of ${N} · ${a.name}`;
  $("gDots").innerHTML=STEPSC.map((_,i)=>`<i class="${i<step?"done":i===step?"on":""}"></i>`).join("");$("gDots").hidden=false;
  $("gDo").innerHTML=(a.do||"")+` Tap <b>${a.name}</b>.`;
  clearHL();$("cA").classList.add("hl");updateActs();
}
function guideEvent(done){
  if(!guided)return;
  const q=STEPSC[done-1].ask,last=done===N;
  if(!q){if(last)finishGuide();else renderGuide();return;}
  asking=true;updateActs();
  openSheet(`Guide asks · Step ${done}`,q.q,optsHTML(q,"g-"+done),`<button class="btn" id="gNext" disabled>${last?"Finish":"Next step →"}</button>`);
  $("sheetBody").querySelectorAll("input").forEach(inp=>inp.onchange=()=>{markQ($("sheetBody"),q);$("gNext").disabled=false;});
  $("gNext").onclick=()=>{asking=false;autoAt=performance.now()+500;closeSheet();if(last)finishGuide();else renderGuide();};
}
function finishGuide(){
  clearHL();updateActs();
  $("gDots").innerHTML=STEPSC.map(()=>'<i class="done"></i>').join("");
  $("gStep").textContent="Complete";
  $("gDo").innerHTML=`${CFG.finish.title||"Done!"} Try another option${CT.length?", move the slider":""}, or try <b>Challenge</b>.`;
  openSheet("Well done",CFG.finish.title||"Complete!",CFG.finish.html||"",
    `<button class="btn ghost" id="fFree">Challenge mode</button>${TH.length?'<button class="btn" id="fThink">Think questions →</button>':""}`);
  $("fFree").onclick=()=>{closeSheet();setMode(false);};
  if(TH.length)$("fThink").onclick=()=>{closeSheet();showTab("think");};
}
function renderFree(){
  $("coachIcon").textContent="FREE";$("gDots").hidden=true;
  $("gStep").textContent=step<N?`Challenge · ${step} of ${N} steps done`:"Challenge complete";
  $("gDo").innerHTML=step<N?"Do it yourself. Tap the steps in the right order.":"Great! You did every step. Try another option, or go to <b>Think</b>.";
}
function setMode(g){
  guided=g;asking=false;closeSheet();
  $("modeGuided").setAttribute("aria-pressed",g);$("modeFree").setAttribute("aria-pressed",!g);
  clearHL();resetMech();
}
function playLabel(){const b=$("bPlay");b.textContent=!auto?"▶ Start":paused?"▶ Resume":"⏸ Pause";
  b.setAttribute("aria-label",!auto?"Start automatic walkthrough":paused?"Resume":"Pause");}
$("bPlay").onclick=()=>{
  if(!auto){if(step>=N)resetMech();auto=true;paused=false;autoAt=0;}
  else paused=!paused;
  playLabel();};
$("modeGuided").onclick=()=>setMode(true);$("modeFree").onclick=()=>setMode(false);

/* ---------- Loop ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;
  if(auto&&!paused&&!anim&&!asking&&step<N&&now>=autoAt)tryAct(step);
  if(auto&&step>=N&&!anim){auto=false;paused=false;playLabel();}
  if(!paused)stepSim(dt);if(!$("scrPlay").hidden){frame();updateHud();}requestAnimationFrame(loop);}
resize();setMode(true);requestAnimationFrame(loop);
window.__lab={get step(){return step;},get anim(){return anim;},N,tryAct};   // for automated checks
})();
</script>
